name: FSA API Containment

on:
  pull_request:
    branches: [main]
    paths:
      - 'fsa-api/server/fsa-start.sh'
      - 'fsa-api/server/host-guard.sh'
      - 'fsa-api/README.md'
      - 'fsa-api/tests/test-server-containment.sh'
      - '.github/workflows/fsa-api-containment.yml'
  push:
    branches: [main]
    paths:
      - 'fsa-api/server/fsa-start.sh'
      - 'fsa-api/server/host-guard.sh'
      - 'fsa-api/README.md'
      - 'fsa-api/tests/test-server-containment.sh'
      - '.github/workflows/fsa-api-containment.yml'

permissions:
  contents: read

jobs:
  containment:
    name: FSA API loopback containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Check shell syntax and lint
        run: |
          bash -n fsa-api/server/fsa-start.sh
          bash -n fsa-api/server/host-guard.sh
          bash -n fsa-api/tests/test-server-containment.sh
          shellcheck -S warning fsa-api/server/fsa-start.sh fsa-api/server/host-guard.sh fsa-api/tests/test-server-containment.sh
      - name: Test bind restrictions
        run: bash fsa-api/tests/test-server-containment.sh
